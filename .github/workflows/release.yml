# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
name: release
on:
  push:
    tags:
      - v*
permissions:
  contents: write
jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            pkg_os: linux
            pkg_arch: amd64
            bin: jse
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            pkg_os: linux
            pkg_arch: arm64
            bin: jse
          - os: macos-latest
            target: x86_64-apple-darwin
            pkg_os: darwin
            pkg_arch: amd64
            bin: jse
          - os: macos-latest
            target: aarch64-apple-darwin
            pkg_os: darwin
            pkg_arch: arm64
            bin: jse
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            pkg_os: windows
            pkg_arch: amd64
            bin: jse.exe
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            pkg_os: windows
            pkg_arch: arm64
            bin: jse.exe
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: musl toolchain (linux targets)
        if: startsWith(matrix.target, 'x86_64-unknown-linux-musl') || startsWith(matrix.target, 'aarch64-unknown-linux-musl')
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          if [ "${{ matrix.target }}" = "x86_64-unknown-linux-musl" ]; then
            sudo apt-get install -y musl-tools
          else
            sudo apt-get install -y gcc-aarch64-linux-gnu musl-tools
          fi
      - name: Linker configuration (linux targets)
        if: startsWith(matrix.target, 'x86_64-unknown-linux-musl') || startsWith(matrix.target, 'aarch64-unknown-linux-musl')
        run: |
          set -euo pipefail
          mkdir -p .cargo
          if [ "${{ matrix.target }}" = "x86_64-unknown-linux-musl" ]; then
            linker=musl-gcc
            cc_var=CC_x86_64_unknown_linux_musl
          else
            linker=aarch64-linux-gnu-gcc
            cc_var=CC_aarch64_unknown_linux_musl
          fi
          printf '[target.%s]\nlinker = "%s"\n' "${{ matrix.target }}" "$linker" > .cargo/config.toml
          echo "$cc_var=$linker" >> "$GITHUB_ENV"
      - name: Test
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: cargo test
      - name: Version metadata
        shell: bash
        run: |
          echo "JSE_VERSION_OVERRIDE=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          echo "JSE_COMMIT=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          echo "JSE_BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          pkg="jse-${GITHUB_REF_NAME}-${{ matrix.pkg_os }}-${{ matrix.pkg_arch }}"
          cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" dist/
          cp README.md README.en.md AGENTS.md LICENSE dist/
          cp -R docs dist/docs
          if [ "${{ matrix.pkg_os }}" = windows ]; then
            powershell -NoProfile -Command "Compress-Archive -Path 'dist/${{ matrix.bin }}','dist/README.md','dist/README.en.md','dist/AGENTS.md','dist/docs','dist/LICENSE' -DestinationPath 'dist/${pkg}.zip' -Force"
            rm "dist/${{ matrix.bin }}" dist/README.md dist/README.en.md dist/AGENTS.md dist/LICENSE
            rm -rf dist/docs
          else
            (cd dist && tar -czf "${pkg}.tar.gz" "${{ matrix.bin }}" README.md README.en.md AGENTS.md LICENSE docs \
              && rm "${{ matrix.bin }}" README.md README.en.md AGENTS.md LICENSE && rm -rf docs)
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: jse-${{ matrix.pkg_os }}-${{ matrix.pkg_arch }}
          path: dist/*
          if-no-files-found: error
  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum jse-* > checksums.txt
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --generate-notes --title "${GITHUB_REF_NAME}"
  crates-io:
    name: publish crates.io
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${version}" >&2
            exit 1
          fi
          if [ -z "${CARGO_REGISTRY_TOKEN:-}" ]; then
            echo "CARGO_REGISTRY_TOKEN secret is not configured" >&2
            exit 1
          fi
          status="$(curl -sS -o /dev/null -w '%{http_code}' \
            -A 'jse-release-workflow (https://github.com/wertasy/json-schema-editor-rs)' \
            "https://crates.io/api/v1/crates/json-schema-editor/${version}")"
          case "${status}" in
            200)
              echo "json-schema-editor ${version} already exists on crates.io; skipping publish"
              ;;
            404)
              cargo publish --locked --registry crates-io
              ;;
            *)
              echo "unexpected crates.io response: HTTP ${status}" >&2
              exit 1
              ;;
          esac
