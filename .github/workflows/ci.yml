name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --check
      - name: Lint (architecture gate)
        run: cargo clippy --all-targets --all-features -- -D clippy::too_many_lines
      - name: Architecture invariants
        run: cargo test --test arch
      - name: Test
        run: cargo test
