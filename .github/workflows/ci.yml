name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: GUI build dependencies
        # --all-features turns on the Native Shell front end, which needs
        # GTK (and GStreamer for the platform crate's sound feature).
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libgtk-4-dev clang \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
      - name: Format
        run: cargo fmt --check
      - name: Lint (architecture gate)
        run: cargo clippy --all-targets --all-features -- -D clippy::too_many_lines
      - name: Architecture invariants
        run: cargo test --test arch
      - name: Test
        run: cargo test
