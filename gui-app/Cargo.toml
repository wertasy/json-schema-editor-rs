[package]
name = "jse-gui-app"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
# The GUI front end of jse with the `gui` feature; the nsh runners link
# this crate, which turns the feature on for the editor library.
json-schema-editor = { path = "..", default-features = false, features = ["gui"] }
nsh-core = "=0.7.0"
