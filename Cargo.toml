[package]
name = "json-schema-editor"
version = "0.2.0"
edition = "2024"
description = "Terminal JSON/JSONC/YAML/TOML schema-driven config editor"
license = "MIT"
repository = "https://github.com/wertasy/json-schema-editor-rs"

[[bin]]
name = "jse"
path = "src/main.rs"

[dependencies]
ratatui = "=0.30.2"
crossterm = { version = "=0.29.0", features = ["events", "bracketed-paste"] }
yaml-rust2 = "=0.13.0"
saphyr-parser = "=0.2.2"
jsonschema = { version = "=0.59.0", default-features = false }
ureq = { version = "=3.4.2", default-features = false, features = ["rustls", "socks-proxy"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.154"
regex = "=1.13.1"
anyhow = "=1.0.104"
thiserror = "=2.0.21"
dirs = "=7.0.0"
url = "=2.5.8"
ryu = "=1.0.23"
parking_lot = "0.12.5"

[dev-dependencies]
portable-pty = "=0.9.0"
tiny_http = "=0.12.0"
tempfile = "=3.27.0"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
debug = 0
